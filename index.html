<!DOCTYPE html>
<html>
<head>
  <title>Games</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:20px}
    button{padding:18px 30px;margin:8px;font-size:20px;cursor:pointer}
  </style>
</head>
<body>
  <h2 id="t">Games</h2>
  <div id="list"></div>

<script>
const GAMES = {
  "retro-bowl": { name: "Retro Bowl College", url: "https://lucabazookaa.github.io/retro-bowl-college/" },
  // add new games here: "id": { name: "...", url: "..." },
};

function launch(url) {
  const w = window.open("about:blank", "_blank");
  if (!w) return false;
  w.document.write(`<!DOCTYPE html><html><head><title>Homework</title></head>
    <body style="margin:0;background:#000;overflow:hidden">
    <iframe src="${url}" allow="fullscreen; autoplay; gamepad" allowfullscreen
      style="border:0;width:100vw;height:100vh"></iframe></body></html>`);
  w.document.close();
  return true;
}

function addButton(text, url) {
  const b = document.createElement("button");
  b.textContent = text;
  b.onclick = () => launch(url);
  document.getElementById("list").appendChild(b);
}

const id = new URLSearchParams(location.search).get("game");

if (GAMES[id]) {
  document.getElementById("t").textContent = GAMES[id].name;
  if (!launch(GAMES[id].url)) addButton("▶ Tap to play", GAMES[id].url);
} else {
  Object.values(GAMES).forEach(g => addButton(g.name, g.url));
}
</script>
</body>
</html>
