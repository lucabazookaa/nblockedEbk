<!DOCTYPE html>
<html>
<head>
  <title>Games</title>
  <style>
    body{font-family:sans-serif;background:#111;color:#fff;text-align:center;padding:20px}
    button{padding:14px 22px;margin:6px;font-size:16px;cursor:pointer}
  </style>
</head>
<body>
  <h2>Games</h2>
  <div id="list"></div>

<script>
const GAMES = [
  { name: "Retro Bowl College", url: "https://lucabazookaa.github.io/retro-bowl-college/" },
  // add new games here, one line each
];

function launch(url) {
  const w = window.open("about:blank", "_blank");
  if (!w) return alert("Allow popups for this page.");
  w.document.write(`<!DOCTYPE html><html><head><title>Homework</title></head>
    <body style="margin:0;background:#000;overflow:hidden">
    <iframe src="${url}" allow="fullscreen; autoplay; gamepad" allowfullscreen
      style="border:0;width:100vw;height:100vh"></iframe></body></html>`);
  w.document.close();
}

GAMES.forEach(g => {
  const b = document.createElement("button");
  b.textContent = g.name;
  b.onclick = () => launch(g.url);
  document.getElementById("list").appendChild(b);
});
</script>
</body>
</html>
